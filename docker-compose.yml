version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: humanizer_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: humanizer_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: humanizer_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: mysql://root:password@mysql:3306/humanizer_db
      JWT_SECRET: dev-jwt-super-secret-key-with-minimum-32-characters-length
      CORS_ORIGIN: http://localhost:5173
      DEFAULT_AI_PROVIDER: mock
      MAX_ITERATIONS: 5
      QUALITY_TARGET: 80
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: humanizer_web
    restart: always
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  mysql_data:
